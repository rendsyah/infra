[SERVICE]
    Flush                       5
    Log_Level                   info
    Parsers_File                parsers.conf
    HTTP_Server                 On
    HTTP_Port                   2020

    storage.path                /fluent-bit/storage
    storage.sync                normal
    storage.checksum            on
    storage.backlog.mem_limit   50M
    storage.max_chunks_up       256

[INPUT]
    Name                        tail
    Tag                         docker.*
    Path                        /var/lib/docker/containers/*/*-json.log
    Parser                      docker
    Docker_Mode                 On
    Refresh_Interval            10
    Mem_Buf_Limit               50MB
    Skip_Long_Lines             On

    DB                          /fluent-bit/db/fluentbit.db
    DB.sync                     Normal

    storage.type                filesystem

[FILTER]
    Name                        parser
    Match                       docker.*
    Key_Name                    log
    Parser                      log_json
    Reserve_Data                On

[FILTER]
    Name                        grep
    Match                       docker.*
    Regex                       service -service$

[OUTPUT]
    Name                        loki
    Match                       docker.*
    Host                        grafana-loki-container
    Port                        3100

    Label_Keys                  $service,$environment,$level,$context
    Line_Format                 json

    Retry_Limit                 False

    storage.total_limit_size    5G
