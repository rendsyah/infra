upstream app_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    client_max_body_size 50M;

    # Security headers
    # NOTE: if you add add_header inside a location {} block,
    # these headers will NOT be inherited by that location.
    # Duplicate any needed headers into that location block.
    add_header X-Frame-Options        "SAMEORIGIN"                 always;
    add_header X-Content-Type-Options "nosniff"                    always;
    add_header X-XSS-Protection       "1; mode=block"              always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    location / {
        proxy_pass         http://app_backend;
        proxy_http_version 1.1;

        # Required for upstream keepalive to work
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Conservative timeouts — increase proxy_read_timeout per-location
        # for slow endpoints (AI inference, PDF export, etc.)
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Uncomment for SSE (streaming responses, realtime logs, AI chat)
        # proxy_buffering    off;
        # proxy_cache        off;
        # proxy_read_timeout 3600s;

        # Uncomment for WebSocket (Socket.IO, live dashboards)
        # Remove the Connection "" line above if enabling this
        # proxy_set_header Upgrade    $http_upgrade;
        # proxy_set_header Connection "upgrade";
    }

    location /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }
}
